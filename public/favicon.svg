<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="luno-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#181824"/>
    </linearGradient>
    <linearGradient id="luno-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="luno-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Container -->
  <rect width="64" height="64" rx="16" fill="url(#luno-bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Minimal Precision Focus Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#luno-ring)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="98 34" transform="rotate(-90 32 32)" opacity="0.95"/>

  <!-- Subtle Ambient Core Glow -->
  <circle cx="32" cy="32" r="8" fill="url(#luno-accent)" opacity="0.3"/>

  <!-- Iconic 4-Point Celestial Focus Spark -->
  <path d="M32 19 C32 27.5 32 27.5 23.5 32 C32 32 32 32 32 45 C32 36.5 32 36.5 40.5 32 C32 32 32 32 32 19 Z" fill="url(#luno-accent)"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
